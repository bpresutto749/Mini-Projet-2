[project]
name = "dagger-vs-rlpd-stk"
version = "1.0.0"
description = ""
requires-python = ">=3.12,<3.13"
dependencies = [
    "pysupertuxkart2",
    "gymnasium",
    "numpy",
    "omegaconf",
    "torch",
    "matplotlib",
    "scipy",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
